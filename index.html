<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Block Blast Clone</title>
  <style>
    body {
      margin: 0;
      background: #222;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      margin: 20px;
    }
    #game {
      display: grid;
      grid-template-columns: repeat(9, 40px);
      grid-template-rows: repeat(9, 40px);
      gap: 2px;
      background: #333;
      padding: 10px;
    }
    .cell {
      width: 40px;
      height: 40px;
      background: #444;
      border-radius: 4px;
      transition: background-color 0.2s;
    }
    .block {
      width: 40px;
      height: 40px;
      position: absolute;
      cursor: grab;
      border-radius: 4px;
    }
    #blocks {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }
    #score, #high-score {
      margin-top: 10px;
    }
    .fade-out {
      animation: fadeOut 0.5s ease-out;
    }
    @keyframes fadeOut {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>
  <h1>Block Blast Clone</h1>
  <div id="score">Score: 0</div>
  <div id="high-score">High Score: 0</div>
  <div id="game"></div>
  <div id="blocks"></div>

  <audio id="clearSound" src="https://freesound.org/data/previews/341/341695_6261190-lq.mp3"></audio>
  <audio id="placeSound" src="https://freesound.org/data/previews/558/558507_902567-lq.mp3"></audio>

  <script>
    const game = document.getElementById('game');
    const blocksContainer = document.getElementById('blocks');
    const scoreDisplay = document.getElementById('score');
    const highScoreDisplay = document.getElementById('high-score');
    const clearSound = document.getElementById('clearSound');
    const placeSound = document.getElementById('placeSound');

    const colors = ['red', 'blue', 'green', 'yellow', 'purple', 'orange'];
    let score = 0;
    let highScore = parseInt(localStorage.getItem('highScore')) || 0;
    const grid = [];

    highScoreDisplay.textContent = `High Score: ${highScore}`;

    for (let i = 0; i < 81; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      game.appendChild(cell);
      grid.push(cell);
    }

    function updateScore(value) {
      score += value;
      scoreDisplay.textContent = `Score: ${score}`;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('highScore', highScore);
        highScoreDisplay.textContent = `High Score: ${highScore}`;
      }
    }

    function generateBlock() {
      const block = document.createElement('div');
      block.className = 'block';
      const color = colors[Math.floor(Math.random() * colors.length)];
      block.style.backgroundColor = color;
      block.style.left = `${Math.random() * 300 + 50}px`;
      block.style.top = `${Math.random() * 50 + 350}px`;
      block.setAttribute('draggable', true);

      block.addEventListener('dragstart', e => {
        e.dataTransfer.setData('text/plain', color);
        e.dataTransfer.setDragImage(block, 20, 20);
      });

      blocksContainer.appendChild(block);
    }

    function generateBlocks(count = 3) {
      blocksContainer.innerHTML = '';
      for (let i = 0; i < count; i++) {
        generateBlock();
      }
    }

    game.addEventListener('dragover', e => {
      e.preventDefault();
    });

    game.addEventListener('drop', e => {
      e.preventDefault();
      const x = Math.floor((e.offsetX) / 42);
      const y = Math.floor((e.offsetY) / 42);
      const index = y * 9 + x;
      if (grid[index].style.backgroundColor === '' || grid[index].style.backgroundColor === 'rgb(68, 68, 68)') {
        const color = e.dataTransfer.getData('text/plain');
        grid[index].style.backgroundColor = color;
        placeSound.currentTime = 0;
        placeSound.play();
        updateScore(10);
        checkClearLines();
        generateBlocks(1);
      }
    });

    function animateAndClear(indices) {
      indices.forEach(i => {
        const cell = grid[i];
        cell.classList.add('fade-out');
        setTimeout(() => {
          cell.style.backgroundColor = '';
          cell.classList.remove('fade-out');
        }, 500);
      });
    }

    function checkClearLines() {
      const fullRows = [];
      const fullCols = [];

      for (let r = 0; r < 9; r++) {
        let full = true;
        for (let c = 0; c < 9; c++) {
          if (!grid[r * 9 + c].style.backgroundColor || grid[r * 9 + c].style.backgroundColor === 'rgb(68, 68, 68)') {
            full = false;
            break;
          }
        }
        if (full) fullRows.push(r);
      }

      for (let c = 0; c < 9; c++) {
        let full = true;
        for (let r = 0; r < 9; r++) {
          if (!grid[r * 9 + c].style.backgroundColor || grid[r * 9 + c].style.backgroundColor === 'rgb(68, 68, 68)') {
            full = false;
            break;
          }
        }
        if (full) fullCols.push(c);
      }

      if (fullRows.length > 0 || fullCols.length > 0) {
        clearSound.currentTime = 0;
        clearSound.play();
      }

      fullRows.forEach(r => {
        const indices = [];
        for (let c = 0; c < 9; c++) {
          indices.push(r * 9 + c);
        }
        animateAndClear(indices);
        updateScore(90);
      });

      fullCols.forEach(c => {
        const indices = [];
        for (let r = 0; r < 9; r++) {
          indices.push(r * 9 + c);
        }
        animateAndClear(indices);
        updateScore(90);
      });
    }

    generateBlocks();
  </script>
</body>
</html>
